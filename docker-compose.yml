version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: practice-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: PracticeTracker2026
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: practice-adminer
    restart: always
    ports:
      - "8085:8080"
    depends_on:
      - postgres

  core-api:
    build:
      context: ./services/core
      dockerfile: Dockerfile
    container_name: practice-core-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:PracticeTracker2026@postgres:5432/app
      - JWT_SECRET=practice-tracker-super-secret-key-change-in-prod-2026
      - GCS_BUCKET=practice-tracker-audio-bucket
      - GOOGLE_APPLICATION_CREDENTIALS=/service-account-key.json
    volumes:
      - ./service-account-key.json:/service-account-key.json:ro
      - audio_data:/data/audio
    depends_on:
      postgres:
        condition: service_healthy

  worker-mono:
    build:
      context: ./services/worker-mono
      dockerfile: Dockerfile
    container_name: practice-worker-mono
    restart: always
    ports:
      - "8081:8080"
    environment:
      - CORE_API_URL=http://core-api:8000
      - GCS_BUCKET=practice-tracker-audio-bucket
      - GOOGLE_APPLICATION_CREDENTIALS=/service-account-key.json
    volumes:
      - ./service-account-key.json:/service-account-key.json:ro
    depends_on:
      - core-api

  worker-poly:
    build:
      context: ./services/worker-poly
      dockerfile: Dockerfile
    container_name: practice-worker-poly
    restart: always
    ports:
      - "8082:8080"
    environment:
      - CORE_API_URL=http://core-api:8000
      - GCS_BUCKET=practice-tracker-audio-bucket
      - GOOGLE_APPLICATION_CREDENTIALS=/service-account-key.json
    volumes:
      - ./service-account-key.json:/service-account-key.json:ro
    depends_on:
      - core-api

volumes:
  postgres_data:
  audio_data: